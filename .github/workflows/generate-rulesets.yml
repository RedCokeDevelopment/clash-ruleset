name: Generate aggregate rule providers

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate rule providers
        run: python3 scripts/generate_rulesets.py --output-dir "$RUNNER_TEMP/generated"

      - name: Publish providers to auto branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin auto >/dev/null 2>&1; then
            git fetch origin auto
            git switch --force -C auto origin/auto
            git rm -rf .
            git clean -fdx
          else
            git switch --orphan auto
            git rm -rf .
          fi

          cp "$RUNNER_TEMP/generated/lowlatency.yaml" ./lowlatency.yaml
          cp "$RUNNER_TEMP/generated/generic.yaml" ./generic.yaml
          git add lowlatency.yaml generic.yaml
          if git diff --cached --quiet; then
            echo "Generated providers are unchanged."
            exit 0
          fi
          git commit -m "chore: regenerate aggregate rule providers"
          git push origin HEAD:auto
